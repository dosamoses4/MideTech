const L=$("#lock");let y0=null;
const unlock=()=>L.classList.add("up");
L.onclick=unlock;setTimeout(unlock,2500);
L.addEventListener("touchstart",e=>y0=e.touches[0].clientY,{passive:true});
L.addEventListener("touchmove",e=>{if(y0!==null&&y0-e.touches[0].clientY>40)unlock()},{passive:true});
L.addEventListener("wheel",e=>{if(e.deltaY>0)unlock()},{passive:true});
addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "||e.key==="ArrowUp")unlock()});
